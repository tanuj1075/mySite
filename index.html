<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANTA ARCHIVE | Luxury Sneaker Store</title>
    <meta name="description" content="VANTA ARCHIVE — Premium Modern Luxury Sneaker Store. Discover archival sneakers, performance runners, and timeless silhouettes." />
    <meta property="og:title" content="VANTA ARCHIVE | Luxury Sneaker Store" />
    <meta property="og:description" content="VANTA ARCHIVE — Premium Modern Luxury Sneaker Store. Style. Comfort. Performance." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          if (!localStorage.getItem('vanta_redesign_v2')) {
            localStorage.setItem('vanta_theme_mode', 'light');
            localStorage.setItem('vanta_redesign_v2', 'true');
          }
          var saved = localStorage.getItem('vanta_theme_mode');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F2EC] text-[#242321] antialiased selection:bg-[#B4532A33] selection:text-[#B4532A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
