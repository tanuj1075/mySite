version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vanta-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vanta_secure_password_123
      POSTGRES_DB: vanta_archive
    ports:
      - "5432:5432"
    volumes:
      - vanta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanta-ecommerce
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:vanta_secure_password_123@db:5432/vanta_archive?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_random_secret_min_32_characters_here_12345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_random_refresh_secret_min_32_characters_here_67890}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-your_cashfree_app_id}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-your_cashfree_secret_key}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      CASHFREE_API_VERSION: ${CASHFREE_API_VERSION:-2023-08-01}

volumes:
  vanta_pgdata:
